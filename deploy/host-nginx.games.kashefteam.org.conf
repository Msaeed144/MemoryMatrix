# Host nginx (outside Docker) for games.kashefteam.org
# Docker app must be running:  docker compose up -d --build
# App listens on 127.0.0.1:1234

upstream hamkar_games {
    server 127.0.0.1:1234;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name games.kashefteam.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name games.kashefteam.org;

    ssl_certificate     /etc/ssl/kashefteamcerts/fullchain.pem;
    ssl_certificate_key /etc/ssl/kashefteamcerts/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Do NOT use Connection "upgrade" for normal HTML/API proxying —
    # that is for WebSockets and can break requests.

    location / {
        proxy_pass http://hamkar_games;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
